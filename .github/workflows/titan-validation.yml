name: TITAN Jarvis validation

on:
  push:
    branches:
      - feature/titan-ai-stack
      - feature/voicestudio-integration
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --check bridge/server.mjs
      - run: node --check bridge/voicestudio.mjs
      - run: npm run build
      - name: Verify VoiceStudio adapter
        run: node --input-type=module -e "import { resolveVoiceProvider } from './bridge/voicestudio.mjs'; const provider = await resolveVoiceProvider(false); if (provider !== 'none') throw new Error('Unexpected provider: ' + provider); console.log('VoiceStudio adapter loaded; no provider configured is handled safely.')"