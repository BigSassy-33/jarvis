name: TITAN CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check bridge modules
        run: node --check bridge/server.mjs && node --check bridge/voicestudio.mjs

      - name: Build frontend
        run: npm run build

      - name: Verify VoiceStudio adapter
        run: node --input-type=module -e "import { resolveVoiceProvider } from './bridge/voicestudio.mjs'; const provider = await resolveVoiceProvider(false); if (provider !== 'none') throw new Error('Unexpected provider: ' + provider); console.log('VoiceStudio adapter loaded; no provider configured is handled safely.')"